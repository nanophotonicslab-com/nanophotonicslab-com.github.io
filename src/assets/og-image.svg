<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0A15"/>
      <stop offset="50%" stop-color="#13112A"/>
      <stop offset="100%" stop-color="#0F0E1A"/>
    </linearGradient>
    <!-- Spectral gradient for decorative line -->
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="20%" stop-color="#3B82F6"/>
      <stop offset="40%" stop-color="#06B6D4"/>
      <stop offset="60%" stop-color="#10B981"/>
      <stop offset="80%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle radial glow behind prism -->
  <circle cx="340" cy="315" r="200" fill="#6366F1" opacity="0.06"/>
  <circle cx="340" cy="315" r="120" fill="#818CF8" opacity="0.04"/>

  <!-- Prism (scaled up from favicon) -->
  <g transform="translate(240, 190) scale(3.5)" filter="url(#glow)">
    <!-- Light beam entering prism -->
    <line x1="-20" y1="32" x2="24" y2="34" stroke="#D4D4E8" stroke-width="2.5" opacity="0.7"/>
    <!-- Prism body -->
    <polygon points="32,8 56,52 8,52" fill="#1E1B4B" fill-opacity="0.6" stroke="#6366F1" stroke-width="2"/>
    <!-- Spectral rays exiting -->
    <line x1="40" y1="28" x2="72" y2="14" stroke="#7C3AED" stroke-width="2" opacity="0.9"/>
    <line x1="40" y1="31" x2="72" y2="21" stroke="#3B82F6" stroke-width="2" opacity="0.9"/>
    <line x1="40" y1="34" x2="72" y2="28" stroke="#06B6D4" stroke-width="2" opacity="0.9"/>
    <line x1="40" y1="37" x2="72" y2="35" stroke="#10B981" stroke-width="2" opacity="0.9"/>
    <line x1="40" y1="40" x2="72" y2="42" stroke="#F59E0B" stroke-width="2" opacity="0.9"/>
    <line x1="40" y1="43" x2="72" y2="49" stroke="#EF4444" stroke-width="2" opacity="0.9"/>
  </g>

  <!-- Extended spectral rays (longer, fading out) -->
  <g opacity="0.5" filter="url(#glow)">
    <line x1="492" y1="239" x2="620" y2="190" stroke="#7C3AED" stroke-width="3"/>
    <line x1="492" y1="249" x2="620" y2="214" stroke="#3B82F6" stroke-width="3"/>
    <line x1="492" y1="259" x2="620" y2="238" stroke="#06B6D4" stroke-width="3"/>
    <line x1="492" y1="270" x2="620" y2="263" stroke="#10B981" stroke-width="3"/>
    <line x1="492" y1="280" x2="620" y2="287" stroke="#F59E0B" stroke-width="3"/>
    <line x1="492" y1="291" x2="620" y2="312" stroke="#EF4444" stroke-width="3"/>
  </g>

  <!-- Text: NanophotonicsLab -->
  <text x="660" y="295" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#E8E6F0" letter-spacing="-1">
    Nanophotonics<tspan fill="#818CF8">Lab</tspan>
  </text>

  <!-- Subtitle -->
  <text x="660" y="345" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#8B89A6" letter-spacing="0.5">
    Open nanophotonics research tools
  </text>

  <!-- Spectral line separator at bottom -->
  <rect x="100" y="560" width="1000" height="3" rx="1.5" fill="url(#spectrum)" opacity="0.6"/>

  <!-- URL -->
  <text x="600" y="595" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#6366F1" text-anchor="middle" opacity="0.7">
    nanophotonicslab.com
  </text>
</svg>
