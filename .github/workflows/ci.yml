name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (retry on transient network errors)
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $i) — retrying in 15s…"
            sleep 15
          done
          echo "npm ci failed after 3 attempts"; exit 1
      # Blocking: no new raw hex colours, no broken CSS. Runs before the slower
      # steps so a style slip fails in seconds rather than minutes.
      - name: Lint styles
        run: npm run lint:css

      - name: Type-check .astro
        run: npm run check

      - run: npm test
      - run: npm run build
