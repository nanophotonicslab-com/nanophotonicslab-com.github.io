name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (retry on transient network errors)
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $i) — retrying in 15s…"
            sleep 15
          done
          echo "npm ci failed after 3 attempts"; exit 1
      # The same gates as ci.yml. They have to be repeated here, not just on
      # pull_request: this repo publishes by pushing straight to main, so a PR
      # gate alone would never run on the path that actually reaches the site.
      - name: Lint styles
        run: npm run lint:css
      - name: Type-check .astro
        run: npm run check

      - run: npm test
      - run: npm run build
        env:
          PUBLIC_UMAMI_ID: ${{ vars.PUBLIC_UMAMI_ID }}
          PUBLIC_FEEDBACK_URL: ${{ vars.PUBLIC_FEEDBACK_URL }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
